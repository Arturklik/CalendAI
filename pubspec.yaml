name: calendai
description: >-
  CalendAI — офлайн-первый календарь расписания: импорт расписания через ИИ,
  локальное хранилище SQLite и ручное редактирование.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
