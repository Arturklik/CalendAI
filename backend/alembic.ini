# Alembic configuration for CalendAI backend.
# URL БД берётся из переменной окружения DATABASE_URL (см. alembic/env.py).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Синхронный fallback-URL (используется только если DATABASE_URL не задан).
sqlalchemy.url = postgresql+asyncpg://calendai:calendai@localhost:5432/calendai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
